[project]
name = "adhd-todo-api"
version = "0.1.0"
description = "REST API for an ADHD-focused action suggestion todo app."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "PyJWT>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
