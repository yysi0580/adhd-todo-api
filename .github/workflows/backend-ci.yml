name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_SUGGESTION_ENABLED: "false"
      RUN_REAL_AI_SMOKE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check app tests alembic
      - name: Black
        run: python -m black --check app tests alembic
      - name: Pytest
        run: python -m pytest
